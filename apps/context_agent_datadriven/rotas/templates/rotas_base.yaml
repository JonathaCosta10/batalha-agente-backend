# ==============================================================================
# BASE DE ROTAS DO HARNESS - TEMPLATE YAML
# Aplicativo: context-agent-datadriven (Itaú - Batalha de Agentes Time 2)
# Mapeamento mecânico de categorias e protocolo de negociação de modelos LLM
